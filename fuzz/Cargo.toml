[package]
name = "lycta-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lycta-core = { path = "../crates/lycta-core" }
bincode = "1.3"

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false

[[bin]]
name = "invite"
path = "fuzz_targets/invite.rs"
test = false
doc = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
