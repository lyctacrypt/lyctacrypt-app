[package]
name = "lycta-node"
description = "LyctaCrypt: peer-to-peer node over Tor onion services (arti) and command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lyctacrypt"
path = "src/main.rs"

[dependencies]
lycta-core = { path = "../lycta-core" }
arti-client.workspace = true
tor-hsservice.workspace = true
tor-cell.workspace = true
tor-rtcompat.workspace = true
tor-hscrypto.workspace = true
tor-llcrypto.workspace = true
tor-config.workspace = true
tor-keymgr.workspace = true
tor-guardmgr.workspace = true

qrcode = { version = "0.14", default-features = false }

tokio.workspace = true
futures.workspace = true
rpassword.workspace = true
dirs.workspace = true
anyhow.workspace = true
rand.workspace = true
zeroize.workspace = true
serde.workspace = true
bincode.workspace = true
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
serde_json = "1"
sha2.workspace = true
ed25519-dalek.workspace = true
data-encoding.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
