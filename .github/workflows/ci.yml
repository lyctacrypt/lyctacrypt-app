name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: GUI system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev \n            libxdo-dev libayatana-appindicator3-dev libv4l-dev libclang-dev
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [frame, content, invite, handshake]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzzing ${{ matrix.target }}
        working-directory: fuzz
        run: |
          SECS=120
          if [ "${{ github.event_name }}" = "schedule" ]; then SECS=1800; fi
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$SECS -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts

  proverif:
    name: Formal proof (ProVerif)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y proverif
      - name: Handshake verification
        run: |
          proverif formal/handshake.pv | tee proverif.log
          grep -E "^RESULT" proverif.log
          if grep -E "^RESULT .* (is false|cannot be proved)" proverif.log; then
            echo "::error::a handshake property is not proved"; exit 1
          fi
          test "$(grep -c '^RESULT .* is true' proverif.log)" -ge 3

  sandbox-linux:
    name: Sandbox Landlock + mlockall (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo build -p lycta-node --release --locked
      - name: The binary starts under Landlock
        run: |
          mkdir -p /tmp/lycta
          ulimit -l unlimited || true
          timeout 20 ./target/release/lyctacrypt --data-dir /tmp/lycta --sandbox < /dev/null 2>&1 | tee out.log || true
          grep -E "core dumps disabled" out.log

  e2e-tor:
    name: End to end on the real Tor network
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --release --locked -p lycta-node --example e2e -- /tmp/lycta-e2e
